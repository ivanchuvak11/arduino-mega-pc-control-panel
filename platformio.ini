[platformio]
default_envs = megaatmega2560

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

lib_deps =
  olikraus/U8g2
  adafruit/RTClib
  arduino-libraries/SD

[env:megaatmega2560]
build_flags =
  -Wall
  -Wextra
  -D DISPLAY_WOKWI_SSD1306

[env:real-ssd1309]
build_flags =
  -Wall
  -Wextra
  -D DISPLAY_REAL_SSD1309
